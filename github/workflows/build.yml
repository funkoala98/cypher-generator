## 🔍 Key Configuration Features

* **Multi-Branch Support**: Triggers builds on pushes to both `main` and `master` branches so actions run regardless of default branch naming.
* **Manual Run Trigger (`workflow_dispatch`)**: Adds a "Run workflow" button under your **Actions** tab to manually trigger builds without needing a new commit.
* **Subfolder & Space Resolution**: Uses `--paths="cypher generator v 2.1.1"` and quoted entry points so PyInstaller correctly parses folder names with spaces.
* **Hidden Import Integration**: Passes `--hidden-import=lettergen` to ensure `lettergen.py` is bundled alongside `main.py`.
* **Artifact Upload**: Packages the output directory (`dist/main`) into a downloadable ZIP archive via `actions/upload-artifact@v4`.
