name: Build Executable

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --paths="cypher generator v 2.1.1" --hidden-import=lettergen "cypher generator v 2.1.1/main.py"

      - name: Upload Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cypher-generator-windows
          path: dist/main
