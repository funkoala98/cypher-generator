name: Build Cross-Platform Executables

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: app-linux
            executable_extension: ""
            path_sep: ":"
          - os: windows-latest
            artifact_name: app-windows
            executable_extension: ".exe"
            path_sep: ";"
          - os: macos-latest
            artifact_name: app-macos
            executable_extension: ""
            path_sep: ":"

    defaults:
      run:
        working-directory: "cypher generator"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      shell: bash

    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile --clean --add-data "Foxy Encryption Logo.png${{ matrix.path_sep }}." --name "CypherGenerator" main.py
      shell: bash

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: "cypher generator v 2.1.1/dist/CypherGenerator${{ matrix.executable_extension }}"
